<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Kanban Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="board-title">Team Board</h1>
    <div class="topbar-right">
      <select class="chip" id="filter-function" title="Filter by function">
        <option value="">All functions</option>
        <option value="Engineering">Engineering</option>
        <option value="Products">Products</option>
        <option value="Sales">Sales</option>
        <option value="Marketing &amp; Lead Generation">Marketing &amp; Lead Generation</option>
      </select>
      <select class="chip" id="filter-category" title="Filter tasks by category">
        <option value="">All task categories</option>
        <option value="Feature">Feature</option>
        <option value="Bug">Bug</option>
        <option value="Improvement">Improvement</option>
        <option value="Testing">Testing</option>
        <option value="Documentation">Documentation</option>
      </select>
      <select class="chip" id="filter-priority" title="Filter by priority">
        <option value="">All priorities</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="urgent">Urgent</option>
      </select>
      <select class="chip" id="filter-story" title="Filter by story" style="max-width:200px;">
        <option value="">All stories</option>
      </select>
      <select class="chip" id="filter-status" title="Filter by status">
        <option value="">All status</option>
        <option value="todo">To Do</option>
        <option value="in_progress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <button class="chip" id="my-tasks-toggle" title="Show only tasks assigned to you">My tasks only</button>
      <button class="chip" id="manage-members-btn">Team</button>
      <button class="chip" id="whoami-chip"></button>
    </div>
  </div>

  <div class="board" id="board">
    <!-- columns injected by app.js -->
  </div>
</div>

<div class="overlay" id="whoami-overlay" style="display:none;">
  <div class="modal">
    <h2>Who are you?</h2>
    <p style="font-size:13px;color:var(--text-dim);margin-top:-8px;">Pick your name so teammates know who's doing what. This is just a label, not a password.</p>
    <div class="field">
      <label>Your name</label>
      <select id="whoami-select"></select>
    </div>
    <div class="field">
      <label>Or add yourself</label>
      <input type="text" id="whoami-new-name" placeholder="Type your name and press Add" />
    </div>
    <div class="modal-actions">
      <button class="btn secondary" id="whoami-add">Add me</button>
      <div class="right">
        <button class="btn" id="whoami-continue">Continue</button>
      </div>
    </div>
  </div>
</div>

<!-- Story modal -->
<div class="overlay" id="story-overlay" style="display:none;">
  <div class="modal story-modal">
    <div class="story-modal-head">
      <h2 id="story-modal-title">New Story</h2>
      <button class="story-modal-close" id="story-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="story-modal-body">
      <div class="field">
        <label>Status</label>
        <div class="status-tabs" id="story-status-tabs">
          <div class="status-tab todo" data-status="todo">To Do</div>
          <div class="status-tab in_progress" data-status="in_progress">In Progress</div>
          <div class="status-tab done" data-status="done">Done</div>
        </div>
      </div>
      <div class="field">
        <label>Story Title</label>
        <input type="text" id="story-title" placeholder="e.g. Launch the new landing page" />
      </div>
      <div class="row-2">
        <div class="field">
          <label>Function</label>
          <select id="story-function">
            <option value="" disabled hidden>Select function</option>
            <option value="Engineering">Engineering</option>
            <option value="Products">Products</option>
            <option value="Sales">Sales</option>
            <option value="Marketing &amp; Lead Generation">Marketing &amp; Lead Generation</option>
          </select>
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="story-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Story Description</label>
        <textarea id="story-desc" placeholder="Optional details..."></textarea>
      </div>
      <div class="field">
        <label>Due date</label>
        <input type="date" id="story-due" />
      </div>
      <div class="field">
        <label>Done when</label>
        <textarea id="story-done-when" placeholder="e.g. Checkout flow passes QA"></textarea>
      </div>
      <div class="field story-tasks-section">
        <div class="task-section-head">
          <label>Tasks</label>
          <button class="btn secondary small" id="story-add-task" type="button">+ New Task</button>
        </div>
        <div class="story-task-list" id="story-task-list"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger ghost" id="story-delete" style="display:none;">Delete</button>
      <div class="right">
        <button class="btn secondary" id="story-cancel">Cancel</button>
        <button class="btn" id="story-save">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Task popup (opens on top of the story modal) -->
<div class="overlay" id="task-overlay" style="display:none;">
  <div class="modal">
    <h2 id="task-modal-title">New Task</h2>
    <div class="field">
      <label>Task Name</label>
      <input type="text" id="task-name" placeholder="e.g. Design the hero section" />
    </div>
    <div class="field">
      <label id="task-assignees-label">Assignees</label>
      <div class="assignee-picker" id="task-assignees">
        <div class="assignee-picker-box" id="task-assignees-box" tabindex="0" role="button"
             aria-haspopup="listbox" aria-expanded="false" aria-labelledby="task-assignees-label"></div>
        <div class="assignee-picker-menu" id="task-assignees-menu" role="listbox" aria-multiselectable="true" hidden></div>
      </div>
    </div>
    <div class="field">
      <label>Task Category</label>
      <select id="task-category">
        <option value="Feature">Feature</option>
        <option value="Bug">Bug</option>
        <option value="Improvement">Improvement</option>
        <option value="Testing">Testing</option>
        <option value="Documentation">Documentation</option>
      </select>
    </div>
    <div class="field">
      <label>Task Description</label>
      <textarea id="task-desc" placeholder="Optional details..."></textarea>
    </div>
    <div class="field">
      <label>Status</label>
      <div class="status-tabs" id="task-status-tabs">
        <div class="status-tab todo" data-status="todo">To Do</div>
        <div class="status-tab in_progress active" data-status="in_progress">In Progress</div>
        <div class="status-tab done" data-status="done">Done</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger ghost" id="task-delete" style="display:none;">Delete</button>
      <div class="right">
        <button class="btn secondary" id="task-cancel">Cancel</button>
        <button class="btn" id="task-save">Save Task</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="members-overlay" style="display:none;">
  <div class="modal">
    <h2>Team members</h2>
    <div class="member-manage-list" id="member-manage-list"></div>
    <div class="field">
      <label>Add a member</label>
      <input type="text" id="new-member-name" placeholder="Full name" />
    </div>
    <div class="modal-actions">
      <div></div>
      <div class="right">
        <button class="btn secondary" id="members-close">Close</button>
        <button class="btn" id="members-add">Add</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-holder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
